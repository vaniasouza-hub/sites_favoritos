<!-- Avisa ao navegador que este é um documento em HTML5 -->
<!DOCTYPE html>

<!-- Indica o início do código HTML e que o idioma principal é o inglês (en) -->
<html lang="en">

<head>
   
    <meta charset="UTF-8">
    
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- O título que aparece na aba do navegador -->
    <title> Meus sites favoritos</title>
</head>

<body>
    <!-- h1:  título da página principal -->
    <h1> Meus sites favoritos: Maria Vania</h1>

    <!-- h2: subtítulo  -->
    <h2>Google</h2>
    
    <!-- img: Exibe uma imagem na tela -->
    <!-- src: O nome/caminho do arquivo da imagem -->
    <!-- alt: Texto que aparece se a imagem quebrar ou para pessoas cegas saberem o que é -->
    <!-- width: Define a largura da imagem fixada em 150 pixels -->
    <img src="imagem_google.jpg" alt="imagem do site google" width="150">
    
    <!-- br: Pula uma linha (como o 'Enter' do teclado) -->
    <br>
    
    <!-- a: Cria um link clicável -->
    <!-- href: O endereço do site para onde o usuário será levado ao clicar -->
    <a href="https://www.google.com/">Google</a>
    
    <!-- Dois pulos de linha para dar espaço até o próximo site -->
    <br><br>
    
    <!-- h3:  subtítulo -->
    <h3>Facebook</h3>
    <img src="facebook.jpg" alt="imagem site facebook.jpg "width="150"><br>
    <a href="https://www.facebook.com/">Facebook</a><br><br>

     <!-- h4:  subtítulo -->
    
    <h4>instagram</h4>
    <img src="instagram.jpg" alt="imagem site instagram " width="150"><br>
    <a href="https://www.instagram.com/">Instagram</a><br><br>
    
    <!-- h5: Subtítulo  -->
    <h5>ChatGPT</h5>
    <img src="chat_gpt.jpg" alt="imagem site chatGpt "width="150"><br>
    <a href="https://chat.openai.com/">ChatGPT</a><br><br>

    <!-- h6: Subtitulo -->
    <h6>Youtube</h6>
    <img src="site.youtube.jpg" alt="imagem site Youtube "width="150"><br>
    <a href="https://www.youtube.com/">Youtube</a><br><br>


</body>


</html>
